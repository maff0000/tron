# TRON configuration: execution-related operational parameters.
# Validates against schemas/config/execution.schema.json.
# Bounded to structural/operational submission parameters; risk limit values
# live in limits.yaml, not here.
config_schema_version: "1"
supported_execution_modes:
  - market
order_submission_timeout_ms: 5000
order_submission_max_retries: 2
retry_backoff_ms: 1000
broker_state_read_timeout_ms: 3000
